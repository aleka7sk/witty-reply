name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: witty_test
          POSTGRES_USER: witty
          POSTGRES_PASSWORD: witty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U witty -d witty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://witty:witty@localhost:5432/witty_test?sslmode=disable
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./cmd/witty-reply
      - name: Vulnerability scan
        if: matrix.go-version == '1.26.5'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag witty-reply:ci .
